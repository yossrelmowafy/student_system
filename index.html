<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستر يسر الموافي - نظام المحاسبة وإدارة الأعمال</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
       .hero-bg {
            background: linear-gradient(rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.7)), url('https://raw.githubusercontent.com/yossrelmowafy/student_system/main/bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="hero-bg text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900/95 text-white p-8 rounded-3xl shadow-2xl w-full max-w-4xl text-center space-y-6 border border-slate-700">
        
        <h2 class="text-3xl font-black text-blue-400">مستر يسر الموافي</h2>
        <p class="text-sm text-gray-400">نظام إدارة المحاسبة وإدارة الأعمال - البكالوريا</p>

        <div id="app-container" class="space-y-4">
            <!-- الشاشة الافتتاحية للاختيار -->
            <div id="login-screen" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4 max-w-md mx-auto">
                <h3 class="font-bold text-lg text-blue-300">تسجيل الدخول لوحة المشرف</h3>
                <input type="password" id="admin-pass" placeholder="أدخل كلمة مرور المشرف" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-600 text-center text-white focus:outline-none focus:border-blue-500">
                <button onclick="checkAdminLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition shadow-lg">
                    <i class="fa-solid fa-user-shield ml-2"></i> دخول لوحة المشرف
                </button>
            </div>

            <!-- لوحة التحكم (مخفية حتى يتم الدخول) -->
            <div id="admin-dashboard" class="hidden space-y-6 text-right">
                <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <span class="font-bold text-emerald-400"><i class="fa-solid fa-circle-check ml-1"></i> أهلاً بك يا مستر يسر في لوحة التحكم</span>
                    <button onclick="location.reload()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-xs font-bold">تسجيل خروج</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center">
                        <span class="text-xs text-gray-400 block">إجمالي الطلاب</span>
                        <span id="stat-students" class="text-2xl font-black text-blue-400">0</span>
                    </div>
                    <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center">
                        <span class="text-xs text-gray-400 block">طلبات الحضور المعلقة</span>
                        <span id="stat-att" class="text-2xl font-black text-amber-400">0</span>
                    </div>
                    <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center">
                        <span class="text-xs text-gray-400 block">طلبات الدفع المعلقة</span>
                        <span id="stat-pay" class="text-2xl font-black text-indigo-400">0</span>
                    </div>
                </div>

                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                    <h4 class="font-bold text-blue-300">إضافة طالب جديد</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <input type="text" id="student-name" placeholder="اسم الطالب" class="px-4 py-3 rounded-xl bg-slate-900 border border-slate-600 text-white">
                        <input type="text" id="student-phone" placeholder="رقم الهاتف" class="px-4 py-3 rounded-xl bg-slate-900 border border-slate-600 text-white">
                    </div>
                    <button onclick="addStudent()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold transition">حفظ وإضافة الطالب</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let students = JSON.parse(localStorage.getItem('yossr_students')) || [];

        function checkAdminLogin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "23122002YY") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                updateStats();
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        function updateStats() {
            document.getElementById('stat-students').innerText = students.length;
        }

        function addStudent() {
            const name = document.getElementById('student-name').value;
            const phone = document.getElementById('student-phone').value;
            if(!name) { alert("أدخل اسم الطالب"); return; }
            
            students.push({ name, code: "YOSS-" + Math.floor(100 + Math.random() * 900), phone });
            localStorage.setItem('yossr_students', JSON.stringify(students));
            document.getElementById('student-name').value = '';
            document.getElementById('student-phone').value = '';
            updateStats();
            alert("تم إضافة الطالب بنجاح!");
        }
    </script>
</body>
</html>
